[general]

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/*.otf,assets/fonts/*.txt,assets/ui/icons/*.txt,assets/ui/icons/*.md,THIRD_PARTY_NOTICES.md"
exclude_filter="build/*, output/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Infinite procedural wildlands, action combat, army building, castle conquest, the Corrupt Python Emperor, Kaeron, and the four-phase postgame boss Aionis.\"><meta name=\"theme-color\" content=\"#09131b\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/app/app_icon.png"
progressive_web_app/icon_180x180="res://assets/app/app_icon.png"
progressive_web_app/icon_512x512="res://assets/app/app_icon.png"
progressive_web_app/background_color=Color(0.035, 0.055, 0.075, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
